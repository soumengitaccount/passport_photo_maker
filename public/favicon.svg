<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <!-- Background App Rounded Square -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- ID Photo Card Frame -->
  <rect x="12" y="10" width="40" height="44" rx="6" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Passport Portrait Silhouette Box -->
  <rect x="18" y="15" width="28" height="24" rx="3" fill="#e0e7ff" />
  
  <!-- Portrait Head -->
  <circle cx="32" cy="23" r="5" fill="#4f46e5" />
  <!-- Portrait Shoulders -->
  <path d="M24 37c0-4.418 3.582-8 8-8s8 3.582 8 8" fill="#4f46e5" />
  
  <!-- ID Lines -->
  <rect x="18" y="43" width="18" height="2.5" rx="1.25" fill="#94a3b8" />
  <rect x="18" y="48" width="28" height="2.5" rx="1.25" fill="#cbd5e1" />
  
  <!-- Camera Flash / Badge Accent -->
  <circle cx="46" cy="18" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <path d="M44.5 18l1 1 2-2" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
